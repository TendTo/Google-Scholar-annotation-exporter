    <use href="#highlight-right" transform="translate(5, 35)" />
  </g>

  <text alignment-baseline="after-edge" text-anchor="start" x="650" y="280" font-size="80" fill="black">
    Google Scholar
  </text>
  <text alignment-baseline="after-edge" text-anchor="start" x="650" y="380" font-size="80" fill="black">
