<div class="gs-aex-grid">
    <!-- First Row -->
    <button id="gs-aex-select-all" type="button" title="{{select_all_title}}"
        aria-label="{{select_all_title}}">{{select_all}}</button>
    <label id="gs-aex-cite-style-label" for="gs-aex-cite-style" title="{{citation_style_title}}"
        aria-label="{{citation_style_title}}">{{citation_style}}</label>
    <select id="gs-aex-cite-style">
    </select>
    <button id="gs-aex-reset" type="button" title="{{reset_title}}" aria-label="{{reset_title}}">{{reset}}</button>
    <button id="gs-aex-export-selected" class="gs-aex-primary" type="button" title="{{export_selected_title}}"
        aria-label="{{export_selected_title}}">{{export_selected}}</button>
    <!-- Second Row -->
    <button id="gs-aex-deselect-all" type="button" title="{{deselect_all_title}}"
        aria-label="{{deselect_all_title}}">{{deselect_all}}</button>
    <label id="gs-aex-export-format-label" for="gs-aex-export-format" title="{{export_as_title}}"
        aria-label="{{export_as_title}}">{{export_as}}</label>
    <select id="gs-aex-export-format">
    </select>
    <div id="gs-aex-fetch-context-group" class="gs-aex-group">
        <label for="gs-aex-fetch-context" title="{{fetch_context_title}}"
            aria-label="{{fetch_context_title}}">{{fetch_context}}</label>
        <input id="gs-aex-fetch-context" class="gs-aex-checkbox" type="checkbox" />
    </div>
    <button id="gs-aex-export-all" type="button" title="{{export_all_pages_title}}"
        aria-label="{{export_all_pages_title}}">{{export_all_pages}}</button>
    <!-- Third Row -->
    <div id="gs-aex-status"></div>
</div>
