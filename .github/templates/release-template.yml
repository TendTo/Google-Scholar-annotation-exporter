  ## Changes

  $CHANGES
header: |
  ## Installation

  There are three ways to install this extension.

  ### Chrome Web Store

  Install the extension from the official [Chrome Web Store](https://chrome.google.com/webstore/detail/google-scholar-annotation-ex/dkcipnihgbegpammhgkobheodoknplma).

  ### Release archive

  - Download the latest `extension.zip` file from the [releases page](https://github.com/TendTo/google-scholar-annotation-exporter/releases)
  - Open the Chrome extensions page (`chrome://extensions/`)
  - Enable "Developer mode" in the top right corner
  - Click "Load unpacked" and select the downloaded `extension.zip` file

  ### Source code

  - Clone the repository: `git clone https://github.com/TendTo/google-scholar-annotation-exporter.git`
  - Build the extension: `pnpm install && pnpm build`
  - Open the Chrome extensions page (`chrome://extensions/`)
  - Enable "Developer mode" in the top right corner
  - Click "Load unpacked" and select the cloned repository folder (the one containing the `manifest.json` file)
